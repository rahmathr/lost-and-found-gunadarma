name: Seed Demo Accounts on Neon Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-production-demo-seeders
  cancel-in-progress: false

jobs:
  seed-demo-accounts:
    name: Create initial demo accounts
    if: github.ref == 'refs/heads/deploy-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout deploy-demo
        uses: actions/checkout@v4
        with:
          ref: deploy-demo

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pgsql, zip, bcmath, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Verify required secrets
        env:
          DB_URL: ${{ secrets.NEON_PRODUCTION_DATABASE_URL }}
          APP_KEY: ${{ secrets.APP_KEY_PRODUCTION }}
          DEMO_SUPER_ADMIN_PASSWORD: ${{ secrets.DEMO_SUPER_ADMIN_PASSWORD }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
          DEMO_SATPAM_PASSWORD: ${{ secrets.DEMO_SATPAM_PASSWORD }}
        run: |
          test -n "$DB_URL" || { echo "Secret NEON_PRODUCTION_DATABASE_URL belum diatur."; exit 1; }
          test -n "$APP_KEY" || { echo "Secret APP_KEY_PRODUCTION belum diatur."; exit 1; }
          test -n "$DEMO_SUPER_ADMIN_PASSWORD" || { echo "Secret DEMO_SUPER_ADMIN_PASSWORD belum diatur."; exit 1; }
          test -n "$DEMO_ADMIN_PASSWORD" || { echo "Secret DEMO_ADMIN_PASSWORD belum diatur."; exit 1; }
          test -n "$DEMO_SATPAM_PASSWORD" || { echo "Secret DEMO_SATPAM_PASSWORD belum diatur."; exit 1; }

      - name: Seed campus and demo accounts
        env:
          APP_ENV: production
          APP_KEY: ${{ secrets.APP_KEY_PRODUCTION }}
          APP_DEBUG: 'false'
          DB_CONNECTION: pgsql
          DB_URL: ${{ secrets.NEON_PRODUCTION_DATABASE_URL }}
          DB_SSLMODE: require
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
          DEMO_SUPER_ADMIN_PASSWORD: ${{ secrets.DEMO_SUPER_ADMIN_PASSWORD }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
          DEMO_SATPAM_PASSWORD: ${{ secrets.DEMO_SATPAM_PASSWORD }}
        run: |
          php artisan db:seed --class="Database\\Seeders\\KampusSeeder" --force
          php artisan db:seed --class="Database\\Seeders\\SuperAdminSeeder" --force
          php artisan db:seed --class="Database\\Seeders\\AdminKampusSeeder" --force
          php artisan db:seed --class="Database\\Seeders\\SatpamSeeder" --force
